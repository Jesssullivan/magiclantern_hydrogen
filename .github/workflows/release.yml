# Release workflow for magiclantern_hydrogen
# - Triggered by pushing a vX.Y.Z tag
# - Builds firmware for the in-scope matrix, attaches artifacts, regenerates
#   CHANGELOG via git-cliff (consumed from flake.nix).

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.ATTIC_SERVER || 'https://nix-cache.tinyland.dev' }}/${{ vars.ATTIC_CACHE || 'main' }}
            extra-trusted-public-keys = ${{ secrets.ATTIC_PUBLIC_KEY }}

      - name: build-all
        run: nix develop --command just build-all

      - name: stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for p in 5D2.212 5D3.113 5D3.123 5D4.133; do
            find "platform/$p" -maxdepth 4 \( -name '*.fir' -o -name 'autoexec.bin' -o -name 'ML*.fir' \) -print -exec cp {} "release-artifacts/" \; || true
          done
          ls -la release-artifacts/

      - name: generate changelog excerpt
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          nix develop --command git-cliff --latest --strip header -o RELEASE_NOTES.md
          echo "tag=${tag}" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: ${{ env.tag }}
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(env.tag, '-') }}
