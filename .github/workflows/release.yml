# Semantic-version release workflow.
#
# Trigger: push of a v* tag (e.g. v0.4.0), or manual workflow_dispatch.
# Delegates to reusable workflows:
#   _build-firmware.yml  → 4-platform firmware artifacts
#   _build-tools.yml     → 2 host tools × 2 platforms = 4 artifacts
#   _publish-release.yml → compose tarballs, render body, publish to GH
#
# Tags containing '-' (e.g. v0.4.0-rc1) are auto-marked prerelease.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.0)."
        required: true

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${tag}"        >> "$GITHUB_OUTPUT"
          if [[ "${tag}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  firmware:
    needs: resolve
    uses: ./.github/workflows/_build-firmware.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  tools:
    needs: resolve
    uses: ./.github/workflows/_build-tools.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  publish:
    needs: [resolve, firmware, tools]
    uses: ./.github/workflows/_publish-release.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
      kind: semver
    secrets: inherit
