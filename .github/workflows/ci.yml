# PR gate for magiclantern_hydrogen
# - fmt-check, lint, build-all (in-scope platforms)
# - host-side tests are stubs today; see TIN-1216
# - QEMU matrix lives in qemu-matrix.yml (nightly + label-triggered)

name: ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.ATTIC_SERVER || 'https://nix-cache.tinyland.dev' }}/${{ vars.ATTIC_CACHE || 'main' }}
            extra-trusted-public-keys = ${{ secrets.ATTIC_PUBLIC_KEY }}
      - name: fmt-check
        run: nix develop --command just fmt-check
      - name: lint
        run: nix develop --command just lint

  build-firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - 5D2.212
          - 5D3.113
          - 5D3.123
          - 5D4.133
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.ATTIC_SERVER || 'https://nix-cache.tinyland.dev' }}/${{ vars.ATTIC_CACHE || 'main' }}
            extra-trusted-public-keys = ${{ secrets.ATTIC_PUBLIC_KEY }}
      - name: build ${{ matrix.platform }}
        run: nix develop --command just build PLATFORM=${{ matrix.platform }}
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ matrix.platform }}
          path: |
            platform/${{ matrix.platform }}/*.fir
            platform/${{ matrix.platform }}/*.bin
            platform/${{ matrix.platform }}/build/**/*.bin
          if-no-files-found: ignore
          retention-days: 14

  cache-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: describe cache attachment
        env:
          ATTIC_SERVER: ${{ vars.ATTIC_SERVER || 'https://nix-cache.tinyland.dev' }}
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE || 'main' }}
          ATTIC_PUBLIC_KEY: ${{ secrets.ATTIC_PUBLIC_KEY }}
        run: bash scripts/cache-attachment-contract.sh

  zig-tools:
    # Build + test the host-side Zig tools (raw-stack, af-log). Linux
    # avoids the macOS 26.5 SDK linker friction documented in TIN-1241.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [raw-stack, af-log]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.ATTIC_SERVER || 'https://nix-cache.tinyland.dev' }}/${{ vars.ATTIC_CACHE || 'main' }}
            extra-trusted-public-keys = ${{ secrets.ATTIC_PUBLIC_KEY }}
      - name: zig build test (${{ matrix.tool }})
        working-directory: tools/${{ matrix.tool }}
        run: nix shell nixpkgs#zig_0_14 --command zig build test
      - name: zig build install (${{ matrix.tool }})
        working-directory: tools/${{ matrix.tool }}
        run: nix shell nixpkgs#zig_0_14 --command zig build
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-linux
          path: tools/${{ matrix.tool }}/zig-out/bin/${{ matrix.tool }}
          if-no-files-found: error
          retention-days: 14

  zig-tools-integration:
    # End-to-end: build both Zig tools, generate a synthetic MLV
    # fixture, decode it, assert expected counts. Catches block-layout
    # regressions without needing firmware in the loop.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.ATTIC_SERVER || 'https://nix-cache.tinyland.dev' }}/${{ vars.ATTIC_CACHE || 'main' }}
            extra-trusted-public-keys = ${{ secrets.ATTIC_PUBLIC_KEY }}
      - name: integration round-trip
        run: nix shell nixpkgs#zig_0_14 --command bash scripts/integration-test-zig-tools.sh
