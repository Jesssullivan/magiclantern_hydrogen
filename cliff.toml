# git-cliff configuration for magiclantern_hydrogen
# https://git-cliff.org/docs/configuration
#
# Conventional Commits format, grouped by type. No AI attribution lines.

[changelog]
header = """
# Changelog

All notable changes to magiclantern_hydrogen — research fork of Magic Lantern.

"""
body = """
{%- macro remote_url() -%}
  https://github.com/Jesssullivan/magiclantern_hydrogen
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
          {% if commit.breaking %} (**BREAKING**){% endif %}\
          ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
    {%- endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Style" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build System" },
    { message = "^ci", group = "CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Chores" },
    { message = "^wip", skip = true },
    { message = "^Merge", skip = true },
    { message = ".*", group = "Other" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
ignore_tags = ""
topo_order = false
sort_commits = "newest"
# Drop AI attribution noise that may slip into commit trailers despite
# repo policy.
commit_preprocessors = [
    { pattern = "Co-Authored-By:.*", replace = "" },
    { pattern = "Co-authored-by:.*", replace = "" },
    { pattern = "🤖[^\n]*", replace = "" },
]
