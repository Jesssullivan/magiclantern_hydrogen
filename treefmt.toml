# treefmt config for magiclantern_hydrogen.
#
# Idempotent fmt-check requires every included formatter to be a no-op
# on the included files. The repo is a fork of Magic Lantern; mass
# reformatting upstream sources is out of scope. Until we have a
# dedicated formatter-rollout initiative, keep includes tight:
#
#   - alejandra on flake.nix (well-tested idempotent formatter)
#   - taplo on treefmt.toml / cliff.toml / *.toml (idempotent)
#   - zig fmt on the host tools (zig fmt is its own contract)
#
# clang-format / prettier / shfmt are NOT included here. Adding them
# requires either:
#   (a) a one-shot pass to format the affected files first, or
#   (b) verifying each handwritten file is already formatter-clean,
# neither of which has been done yet. Tracking as a follow-up.

[formatter.alejandra]
command = "alejandra"
includes = ["flake.nix"]

[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.zig]
command = "zig"
options = ["fmt"]
includes = ["tools/raw-stack/**/*.zig", "tools/af-log/**/*.zig"]
